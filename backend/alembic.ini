[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# database URL is dynamically loaded from app.config.get_settings().database_url in alembic/env.py
sqlalchemy.url = postgresql+asyncpg://localhost/pressure_out_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =

[logger_alembic]
level = INFO
handlers =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
